name: test

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uvx ruff check src tests
      - run: uvx ruff format --check src tests
      - run: bash -n bootstrap.sh publish.sh protect-main.sh

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python: "3.14"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Install
        run: |
          uv venv --python ${{ matrix.python }}
          uv pip install -e '.[test]'
      - name: Test
        run: .venv/bin/python -m pytest -q
      - name: The installed CLI starts
        run: .venv/bin/kship --version && .venv/bin/kship --help > /dev/null

  # The one check main's ruleset requires (.github/rulesets/main.json), so the test
  # matrix can change without touching the ruleset. `always()` matters: a job skipped
  # because a dependency failed counts as passing for a required check.
  checks-passed:
    if: always()
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - name: Lint and every test job passed
        env:
          LINT: ${{ needs.lint.result }}
          TEST: ${{ needs.test.result }}
        run: |
          echo "lint: $LINT, test: $TEST"
          [ "$LINT" = success ] && [ "$TEST" = success ]
